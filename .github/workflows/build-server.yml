name: Build Server

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-linux-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1-stable
          use-dotnet: false

      - name: Install Linux export templates
        run: |
          set -e
          mkdir -p ~/.local/share/godot/export_templates
          curl -sL https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p /tmp/tpz && cd /tmp/tpz
          unzip -q /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          cp -r templates/* ~/.local/share/godot/export_templates/4.7.1.stable/

      - name: Import resources
        run: |
          godot --headless --path . --import

      - name: Export Linux dedicated server
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux Server" build/empire_of_lords_server.x86_64

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-of-lords-server
          path: build/empire_of_lords_server.x86_64

      - name: Attach to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/empire_of_lords_server.x86_64

  build-windows-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1-stable
          use-dotnet: false

      - name: Install export templates
        run: |
          set -e
          mkdir -p ~/.local/share/godot/export_templates
          curl -sL https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p /tmp/tpz && cd /tmp/tpz
          unzip -q /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          cp -r templates/* ~/.local/share/godot/export_templates/4.7.1.stable/

      - name: Import resources
        run: |
          godot --headless --path . --import

      - name: Export Windows client
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/empire_of_lords_windows.exe

      - name: Package Windows build (zip for itch.io)
        run: |
          mkdir -p build/zip/empire-of-lords-win
          cp build/empire_of_lords_windows.exe build/zip/empire-of-lords-win/Empire_of_Lords.exe
          printf 'EMPIRE OF LORDS\nLancez Empire_of_Lords.exe puis cliquez "Rejoindre la partie publique en ligne".\n' > build/zip/empire-of-lords-win/README.txt
          cd build/zip && zip -r ../empire-of-lords-windows.zip empire-of-lords-win

      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-of-lords-windows
          path: build/empire-of-lords-windows.zip

      - name: Attach to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/empire-of-lords-windows.zip
