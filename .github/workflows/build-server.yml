name: Build Server

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-linux-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1-stable
          use-dotnet: false

      - name: Import resources
        run: |
          godot --headless --path . --import

      - name: Export Linux dedicated server
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux Server" build/empire_of_lords_server.x86_64

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: empire-of-lords-server
          path: build/empire_of_lords_server.x86_64

      - name: Attach to GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/empire_of_lords_server.x86_64
